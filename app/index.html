<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#faf7f2">
  <script>
    // Set the theme before the page draws, so it never flashes the wrong colours.
    (function () {
      var t = 'light'; try { t = localStorage.getItem('picos.theme') || 'light'; } catch (e) {}
      var h = new Date().getHours(), night = h >= 20 || h < 7;
      document.documentElement.dataset.theme = t === 'dark' || (t === 'night' && night) ? 'dark' : 'light';
    })();
  </script>
  <title>Picos Baby</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app"></div>
  <div id="sheet" role="dialog" aria-modal="true" hidden></div>
  <div id="toast" role="status" hidden></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
